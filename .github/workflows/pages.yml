# Publishes the game page (GitHub Pages) with only what the game loads (09-11-2026, owner: «publicar solo lo del
# juego»). Before, Pages published the whole branch (505 MB: previews, sources, .blend and .exr of assets/3d, docs,
# tools, tests) and GitHub cut it at 10 min while «syncing files» (6 failures in a row on 09-11).
# Needs Settings › Pages › Source = «GitHub Actions» (to go back: «Deploy from a branch», main, /).
name: Publicar página
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Lo que carga el juego
        # (24-11-2026) the same script prepares Cloudflare Pages (project sniper-1vs1): one list for both sites, and no
        # file above 25 MiB (tools/pagina-publica.sh)
        run: bash tools/pagina-publica.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
