# Publishes the multiplayer server to Cloudflare whenever its code changes on main.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Desplegar servidor
on:
  push:
    branches: [main]
    paths: ['core/**', 'server/**', 'wrangler.toml', '.github/workflows/deploy-server.yml']
  workflow_dispatch:
concurrency: deploy-server
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas del núcleo antes de publicar
        run: node test/core.test.js && node test/room.test.js
      - name: Publicar en Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
