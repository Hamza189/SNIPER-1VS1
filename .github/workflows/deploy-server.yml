# Publishes the multiplayer server to Cloudflare whenever its code changes on main, then
# checks the public server with two real clients. The address and every failed check are
# shown as annotations of the run (gh run view), readable without downloading the logs.
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: Desplegar servidor
on:
  push:
    branches: [main]
    paths: ['core/**', 'server/**', 'client/netcore.js', 'test/public.test.js', 'wrangler.toml', '.github/workflows/deploy-server.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency: deploy-server
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas del núcleo y de la sala antes de publicar
        run: node test/core.test.js && node test/pistol.test.js && node test/shotgun.test.js && node test/room.test.js
      - name: Publicar en Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.42.0'
      - name: Comprobar el servidor público con dos clientes
        run: |
          URL="${{ steps.deploy.outputs.deployment-url }}"
          echo "::notice title=Servidor publicado::$URL"
          sleep 8
          node test/public.test.js "$URL"
