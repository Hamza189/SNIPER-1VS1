# Cloudflare deployment of the multiplayer server (server/worker.js). Free plan: SQLite-backed
# Durable Objects. Deployed by .github/workflows/deploy-server.yml.
name = "sniper-duel"
main = "server/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# 24-11-2026 (propietario): también la copia de Cloudflare Pages, https://sniper-1vs1.pages.dev (tools/pagina-publica.sh)
ALLOWED_ORIGINS = "https://hamza189.github.io,https://sniper-1vs1.pages.dev,http://localhost,http://127.0.0.1"
# cuentas de administrador: todos los objetos desbloqueados para probarlos (server/accounts.js). La del propietario y
# (09-11-2026, a petición suya) la de su novia; (18-11-2026, a petición suya) SD-XYZL-D2W5 y SD-Y8LN-2N9X (Zaib).
ADMIN_IDS = "SD-QTFX-77ZM,SD-P48Q-4YM2,SD-XYZL-D2W5,SD-Y8LN-2N9X"
# Entrar con Google: el ID de cliente OAuth (público, no es secreto) de Google Cloud. Vacío = el botón no sale.
GOOGLE_CLIENT_ID = "1054334204272-tqvhk7uab6q4hmsploia0tv8asl7dffg.apps.googleusercontent.com"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "AccountDO"

[[durable_objects.bindings]]
name = "DIR"
class_name = "DirDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]

# accounts (server/accounts.js, 28-10-2026): one Durable Object per account + the login directory (free plan, SQLite)
[[migrations]]
tag = "v2"
new_sqlite_classes = ["AccountDO", "DirDO"]

# room creation limit per address (Workers Rate Limiting, included in the free plan)
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
