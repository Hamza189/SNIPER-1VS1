# Cloudflare deployment of the multiplayer server (server/worker.js). Free plan: SQLite-backed
# Durable Objects. Deployed by .github/workflows/deploy-server.yml.
name = "sniper-duel"
main = "server/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://hamza189.github.io,http://localhost,http://127.0.0.1"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDO"]
