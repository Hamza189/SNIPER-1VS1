<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Visor de modelos</title>
<style>html,body{margin:0;height:100%;background:#6f7d96}canvas{display:block;width:100%;height:100%}</style></head>
<body><canvas id="c"></canvas>
<script src="../vendor/three.min.js"></script>
<script src="../vendor/GLTFLoader.js"></script>
<script src="../client/vmrig.js"></script>
<script src="pose-lab.js"></script>
<script>
/* Developer viewer for assets/viewmodels.glb (not part of the game).
   ?obj=VIBORA9&yaw=90&pitch=10&dist=0.35&tx=0&ty=0&tz=0&fov=35  — lit like the first-person scene */
const T = THREE, q = new URLSearchParams(location.search), num = (k, d) => q.has(k) ? +q.get(k) : d;
const renderer = new T.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight, false);
const scene = new T.Scene(); scene.background = new T.Color(q.get('bg') || '#6f7d96');
const cam = new T.PerspectiveCamera(num('fov', 35), innerWidth / innerHeight, 0.005, 20);
scene.add(new T.HemisphereLight(0xe8eeff, 0x7a5c40, 1.05));
const key = new T.DirectionalLight(0xffe0bb, 1.3); key.position.set(-1, 2, 1); scene.add(key);
const rim = new T.DirectionalLight(0xffc98f, 0.75); rim.position.set(1.5, 1, -2); scene.add(rim);
const fill = new T.DirectionalLight(0x9fb7ff, 0.35); fill.position.set(1.5, 0.5, -1); scene.add(fill);
// same small environment map as the game's first-person scene
const ENV=(()=>{const face=(top,mid,bot)=>{const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,64);gr.addColorStop(0,top);gr.addColorStop(0.5,mid);gr.addColorStop(1,bot);g.fillStyle=gr;g.fillRect(0,0,64,64);return c;};
  const side=()=>face('#7d8fb0','#f1c08e','#b08a5e');const t=new T.CubeTexture([side(),side(),face('#9fb4d8','#9fb4d8','#9fb4d8'),face('#9a7a52','#9a7a52','#9a7a52'),side(),side()]);t.needsUpdate=true;return t;})();
window.VIEW = { ready: false };
new T.GLTFLoader().load('../assets/viewmodels.glb?' + Date.now(), g => {
  const name = q.get('obj') || 'VIBORA9';
  const o = g.scene.getObjectByName(name) || g.scene;
  scene.add(o); o.position.set(0, 0, 0);
  if (!q.has('raw')) SDVM.refine(o, T, ENV);
  const fp = window.POSE && q.has('lab') ? POSE(g, scene, cam, o, q) : false;
  if (fp) { cam.position.set(0, 0, 0); cam.lookAt(0, 0, -1); }
  else {
  const yaw = num('yaw', 90) * Math.PI / 180, pitch = num('pitch', 10) * Math.PI / 180, d = num('dist', 0.35);
  const tgt = new T.Vector3(num('tx', 0), num('ty', 0), num('tz', 0));
  cam.position.set(tgt.x + d * Math.cos(pitch) * Math.sin(yaw), tgt.y + d * Math.sin(pitch), tgt.z + d * Math.cos(pitch) * Math.cos(yaw));
  cam.lookAt(tgt);
  }
  let tris = 0; o.traverse(m => { if (m.isMesh) tris += m.geometry.index ? m.geometry.index.count / 3 : m.geometry.attributes.position.count / 3; });
  window.VIEW = { ready: true, tris, names: [], scene: g.scene };
  g.scene.traverse(n => VIEW.names.push(n.type + ':' + n.name));
  renderer.render(scene, cam);
}, undefined, e => { window.VIEW = { ready: true, error: String(e && e.message || e) }; });
</script></body></html>
