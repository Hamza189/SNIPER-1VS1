<!doctype html><meta charset="utf-8"><title>SNIPER DUEL · revisión del personaje</title>
<style>body{margin:0;background:#252b31;color:#f3ede1;font:14px system-ui}canvas{display:block}#ui{position:absolute;left:24px;top:20px;z-index:2}h1{font-size:19px;margin:0 0 10px}button,select{background:#39434d;color:white;border:1px solid #7b858d;padding:7px;margin:3px}#info{margin-top:10px;max-width:420px;color:#d3d7d8}.tag{position:absolute;bottom:20px;left:24px;color:#c3cbd0;font-size:12px}</style>
<div id="ui"><h1>SNIPER DUEL — personaje en revisión</h1><select id="clips"></select><select id="variant"><option>A · arena</option><option>B · oliva</option><option>bots · gris</option></select><select id="lod"><option>LOD0</option><option>LOD1</option><option>LOD2</option></select><br><button onclick="setView('front')">Frente</button><button onclick="setView('side')">Perfil</button><button onclick="setView('back')">Espalda</button><button onclick="paused=!paused">Pausa / reproducir</button><button onclick="boxes.visible=!boxes.visible">Impactos</button><div id="info"></div></div><div class="tag">Vista de revisión · sin integración ni validación en iPhone · esfera roja, torso azul, piernas amarillas</div>
<script src="../../../../vendor/three.min.js"></script><script src="../../../../vendor/GLTFLoader.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color('#313a43');
const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.01,40);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.78;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xc9e0ff,0x817159,.65));const key=new THREE.DirectionalLight(0xffebca,1.6);key.position.set(-3,5,5);scene.add(key);const rim=new THREE.DirectionalLight(0xc0d9ff,.9);rim.position.set(3,2,-3);scene.add(rim);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(15,15),new THREE.MeshStandardMaterial({color:0x414951,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.008;scene.add(floor);
let model,mixer,animations,meshes,active='idle_rifle',paused=true,time=0;const boxes=new THREE.Group();scene.add(boxes);
function wire(g,color){return new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color,depthTest:false,transparent:true,opacity:.7}))}
const head=wire(new THREE.SphereGeometry(.15,20,14),0xff635d),torso=wire(new THREE.BoxGeometry(.49,.62,.32),0x62c5ff),legs=wire(new THREE.BoxGeometry(.38,.86,.22),0xffd96a);boxes.add(head,torso,legs);
function hitboxes(name){const k=name.startsWith('crouch')?1/1.62:name==='slide'?.85/1.62:1;head.position.y=1.63*k;torso.position.y=1.17*k;legs.position.y=.43*k;torso.scale.y=legs.scale.y=k;}
function setView(name){camera.position.set(...({front:[0,1.03,4.3],side:[4.3,1.03,0],back:[0,1.03,-4.3],angle:[2.8,1.7,3.4]}[name]));camera.lookAt(0,.90,0);renderer.render(scene,camera)}
function setClip(name,t=0,draw=true){active=name;time=t;mixer.stopAllAction();meshes[0].skeleton.pose();const action=mixer.clipAction(animations.find(a=>a.name===name));action.reset();action.setLoop(THREE.LoopOnce,1);action.clampWhenFinished=true;action.play();mixer.setTime(t);scene.updateMatrixWorld(true);meshes.forEach(m=>m.skeleton.update());hitboxes(name);document.querySelector('#clips').value=name;if(draw)renderer.render(scene,camera)}
function setLOD(n){meshes.forEach((m,i)=>m.visible=i===n);document.querySelector('#lod').selectedIndex=n;renderer.render(scene,camera)}
async function setVariant(name){const tex=await new THREE.TextureLoader().loadAsync('textures/color_'+name+'.jpg');tex.flipY=false;tex.encoding=THREE.sRGBEncoding;meshes[0].material.map=tex;meshes[0].material.needsUpdate=true;document.querySelector('#variant').selectedIndex=['A','B','bots'].indexOf(name);renderer.render(scene,camera)}
function vertices(mesh){const p=mesh.geometry.attributes.position,z=mesh.geometry.attributes._zone;const v=new THREE.Vector3(),out=[];for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);mesh.boneTransform(i,v);v.applyMatrix4(mesh.matrixWorld);out.push([v.x,v.y,v.z,z.getX(i)])}return out}
function measure(name,t,lod=0){setClip(name,t,false);const k=name.startsWith('crouch')?1/1.62:name==='slide'?.85/1.62:1,out={head:0,torso:[0,0,0],legs:[0,0,0],minY:Infinity,maxY:-Infinity};for(const [x,y,z,zone] of vertices(meshes[lod])){out.minY=Math.min(out.minY,y);out.maxY=Math.max(out.maxY,y);if(zone===0)out.head=Math.max(out.head,Math.hypot(x,y-1.63*k,z)-.15);if(zone===1||zone===2){const leg=zone===2,hy=(leg?.43:.31)*k,cy=(leg?.43:1.17)*k,hx=leg?.19:.245,hz=leg?.11:.16,a=leg?out.legs:out.torso;[Math.abs(x)-hx,Math.abs(y-cy)-hy,Math.abs(z)-hz].forEach((v,i)=>a[i]=Math.max(a[i],v))}}return out}
new THREE.GLTFLoader().load('personaje.glb',g=>{model=g.scene;scene.add(model);animations=g.animations;mixer=new THREE.AnimationMixer(model);meshes=[0,1,2].map(i=>model.getObjectByName('personaje_LOD'+i));for(const c of animations){const o=document.createElement('option');o.value=o.textContent=c.name;document.querySelector('#clips').appendChild(o)}document.querySelector('#clips').onchange=e=>setClip(e.target.value);document.querySelector('#variant').onchange=e=>setVariant(['A','B','bots'][e.target.selectedIndex]);document.querySelector('#lod').onchange=e=>setLOD(e.target.selectedIndex);setLOD(0);setClip('idle_rifle');setView('front');document.querySelector('#info').textContent='26 huesos · 28 clips · tres apariencias · un material por LOD activo';window.ready=true;},undefined,e=>window.error=String(e));
let last=performance.now();function tick(now){requestAnimationFrame(tick);if(window.ready&&!paused){const dt=Math.min(.05,(now-last)/1000);const clip=animations.find(a=>a.name===active);time=(time+dt)%Math.max(.001,clip.duration);setClip(active,time)}last=now;}requestAnimationFrame(tick);
</script>
